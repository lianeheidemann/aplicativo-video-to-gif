name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  analise-e-testes:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Conferir formatação
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O build de release exige o keystore, que não vive no repositório.
      # Aqui geramos só o APK de debug: o objetivo deste job é pegar erros de
      # Gradle, de fusão de manifesto e de empacotamento das bibliotecas
      # nativas do FFmpeg — não produzir um artefato publicável.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compilar APK de debug
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
