name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  analise-e-testes:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Conferir formatação
        if: ${{ !cancelled() }}
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análise estática
        if: ${{ !cancelled() }}
        run: flutter analyze

      - name: Testes
        if: ${{ !cancelled() }}
        run: flutter test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: ${{ github.event_name == 'push' && 'generate-and-submit' || 'disabled' }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Compilar APK de debug
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  aplicar-correcao-transparencia:
    name: Aplicar correção de transparência
    if: github.ref == 'refs/heads/fix/transparent-gif-export' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transparent-gif-export
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Aplicar patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/services/ffmpeg_service.dart')
          text = path.read_text()

          replacements = [
              (
                  """    final maskStage = maskPath != null
              ? ';[framed][1:v]alphamerge[$paletteLabel]'
              : '';
""",
                  """    final maskStage = maskPath != null
              ? ';[framed]format=rgba,setpts=PTS-STARTPTS[framed_rgba];'
                  '[1:v]format=gray,setpts=PTS-STARTPTS[mask_gray];'
                  '[framed_rgba][mask_gray]alphamerge=shortest=1[$paletteLabel]'
              : '';
""",
              ),
              (
                  """    final maskStage = maskPath != null
              ? ';[framed][2:v]alphamerge[$useLabel]'
              : '';
""",
                  """    final maskStage = maskPath != null
              ? ';[framed]format=rgba,setpts=PTS-STARTPTS[framed_rgba];'
                  '[2:v]format=gray,setpts=PTS-STARTPTS[mask_gray];'
                  '[framed_rgba][mask_gray]alphamerge=shortest=1[$useLabel]'
              : '';
""",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Trecho esperado não encontrado no ffmpeg_service.dart')
              text = text.replace(old, new, 1)

          old_input = """      if (maskPath != null) ...[
        '-loop',
        '1',
        '-t',
        _seconds(settings.sourceDurationSeconds),
        '-i',
        maskPath,
      ],
"""
          new_input = """      if (maskPath != null) ...[
        '-loop',
        '1',
        '-framerate',
        '${settings.fps}',
        '-t',
        _seconds(settings.outputDurationSeconds),
        '-i',
        maskPath,
      ],
"""
          if text.count(old_input) != 2:
              raise SystemExit(f'Esperava 2 entradas da máscara; encontrei {text.count(old_input)}')
          text = text.replace(old_input, new_input)

          old_comment = """      // `-loop 1` faz a máscara virar um stream infinito. Sem o `-t` aqui,
      // quando o vídeo (finito) termina, o `alphamerge` repete o último
      // quadro dele para sempre em vez de encerrar — e como esta passagem
      // não tem `-frames:v` para limitar a saída, o FFmpeg nunca termina.
"""
          new_comment = """      // A máscara usa a mesma taxa de quadros e a mesma duração final do
      // vídeo filtrado. O alphamerge usa shortest=1 para não repetir quadros
      // nem manter o stream da máscara aberto depois que o vídeo termina.
"""
          text = text.replace(old_comment, new_comment)
          path.write_text(text)
          PY

      - name: Formatar e validar
        run: |
          dart format lib/services/ffmpeg_service.dart
          flutter analyze
          flutter test

      - name: Commitar somente a correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          if [ -f .github/workflows/apply-transparent-fix.yml ]; then
            git rm .github/workflows/apply-transparent-fix.yml
          fi
          git add lib/services/ffmpeg_service.dart .github/workflows/ci.yml
          git commit -m "Corrige exportação GIF com fundo transparente"
          git push origin HEAD:fix/transparent-gif-export
