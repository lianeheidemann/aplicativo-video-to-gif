name: Format transparent fix

on:
  push:
    branches: ['fix/transparent-gif-export']

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transparent-gif-export
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - run: flutter pub get

      - name: Formatar arquivo alterado
        run: dart format lib/services/ffmpeg_service.dart

      - name: Commitar formatação e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-transparent-fix.yml
          git add lib/services/ffmpeg_service.dart
          git commit -m "Formata correção da exportação transparente"
          git push origin HEAD:fix/transparent-gif-export
