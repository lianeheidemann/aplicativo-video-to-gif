name: Release new-interface v1.1.1

# Build de release isolado dos widget tests legados da interface anterior.
on:
  push:
    branches: ['new-interface']
    paths: ['.github/workflows/release-new-interface.yml']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish v1.1.1
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Preparar assinatura
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          PROPS
          echo "signed=yes" >> "$GITHUB_OUTPUT"

      - name: Compilar APKs release
        run: |
          mkdir -p entrega
          flutter build apk --release --split-per-abi --build-name=1.1.1 --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk entrega/video-em-gif-1.1.1-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk entrega/video-em-gif-1.1.1-armeabi-v7a.apk
          flutter build apk --release --build-name=1.1.1 --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk entrega/video-em-gif-1.1.1-universal.apk

      - name: Limpar chave
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: Vídeo em GIF 1.1.1
          target_commitish: new-interface
          files: entrega/*
          fail_on_unmatched_files: true
          body: |
            Nova versão baseada na branch `new-interface`.

            Inclui redimensionamento direto da moldura de recorte pelas alças dos quatro cantos no preview.
            No modo Personalizado, largura e altura são livres; nos formatos fixos, a proporção é preservada.

            Para a maioria dos celulares Android atuais, use `video-em-gif-1.1.1-arm64-v8a.apk`.
            O `universal` é maior, mas serve como alternativa de compatibilidade.
