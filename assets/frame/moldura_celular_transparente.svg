<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151515"/>
      <stop offset="35%" stop-color="#3a3a3a"/>
      <stop offset="65%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#666"/>
      <stop offset="18%" stop-color="#1f1f1f"/>
      <stop offset="80%" stop-color="#111"/>
      <stop offset="100%" stop-color="#555"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <mask id="frameMask">
      <rect width="1080" height="1920" fill="black"/>
      <rect x="76" y="28" width="928" height="1864" rx="122" ry="122" fill="white"/>
      <rect x="105" y="58" width="870" height="1804" rx="96" ry="96" fill="black"/>
    </mask>
  </defs>

  <!-- Outer phone frame; center remains transparent -->
  <rect x="76" y="28" width="928" height="1864" rx="122" ry="122"
        fill="url(#frameGrad)" mask="url(#frameMask)" filter="url(#softShadow)"/>

  <!-- Inner bevel -->
  <rect x="94" y="46" width="892" height="1828" rx="108" ry="108"
        fill="none" stroke="#555" stroke-width="5" opacity="0.55"/>
  <rect x="103" y="56" width="874" height="1808" rx="98" ry="98"
        fill="none" stroke="#090909" stroke-width="9"/>

  <!-- Top speaker -->
  <rect x="420" y="42" width="240" height="8" rx="4" fill="#0a0a0a" opacity="0.95"/>

  <!-- Camera / sensor pill -->
  <rect x="430" y="78" width="220" height="54" rx="27" fill="#050505"/>
  <circle cx="607" cy="105" r="11" fill="#141414"/>
  <circle cx="607" cy="105" r="5" fill="#25354c"/>
  <circle cx="475" cy="105" r="13" fill="#0b0b0b"/>

  <!-- Left-side buttons -->
  <g fill="url(#edgeGrad)">
    <rect x="64" y="370" width="12" height="72" rx="6"/>
    <rect x="62" y="500" width="14" height="132" rx="7"/>
    <rect x="62" y="658" width="14" height="132" rx="7"/>
  </g>

  <!-- Right-side button -->
  <rect x="1004" y="560" width="14" height="178" rx="7" fill="url(#edgeGrad)"/>

  <!-- Small seam details -->
  <g stroke="#6b6b6b" stroke-width="3" opacity="0.45">
    <line x1="196" y1="31" x2="196" y2="47"/>
    <line x1="884" y1="31" x2="884" y2="47"/>
    <line x1="196" y1="1874" x2="196" y2="1890"/>
    <line x1="884" y1="1874" x2="884" y2="1890"/>
  </g>
</svg>
